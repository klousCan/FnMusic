[package]
name = "fnmusic"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
futures-util = "0.3"
md5 = "0.7"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
semver = "1"
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
resvg = { version = "0.45", default-features = false }
tao = { version = "0.32", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
webview2-com = "0.36"
windows = { version = "0.60", features = ["Foundation", "Media", "Media_Control", "Media_Core", "Media_Playback", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.50", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
