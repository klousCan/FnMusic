name: Windows build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust MSVC
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Read and validate version
        shell: pwsh
        run: |
          $metadata = cargo +stable metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'fnmusic').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable major.minor.patch version' }
          $tag = "v$version"
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME must match Cargo.toml version $tag"
          }
          "FNMUSIC_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Test
        run: cargo +stable test --locked
      - name: Build Windows x64
        run: cargo +stable build --release --locked --target x86_64-pc-windows-msvc
      - name: Package versioned portable application and updater
        shell: pwsh
        run: |
          $version = $env:FNMUSIC_VERSION
          New-Item -ItemType Directory -Path dist/FnMusic -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/fnmusic.exe dist/FnMusic/
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.md dist/FnMusic/
          Copy-Item dist/FnMusic/fnmusic.exe dist/fnmusic.exe
          $zip = "FnMusic-v$version-windows-x64.zip"
          Compress-Archive -Path dist/FnMusic -DestinationPath "dist/$zip"
          $exeHash = (Get-FileHash dist/fnmusic.exe -Algorithm SHA256).Hash.ToLower()
          @{
            schema_version = 1
            version = $version
            target = 'windows-x64'
            asset_name = 'fnmusic.exe'
            size = (Get-Item dist/fnmusic.exe).Length
            sha256 = $exeHash
          } | ConvertTo-Json | Set-Content dist/update.json -Encoding utf8NoBOM
          $lines = foreach ($name in @($zip, 'fnmusic.exe', 'update.json')) {
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: FnMusic-windows-x64
          path: |
            dist/*.zip
            dist/fnmusic.exe
            dist/update.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FnMusic-windows-x64
          path: dist
      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "This version is already published; bump Cargo.toml and create a new tag."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "FnMusic $RELEASE_TAG" --generate-notes --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest
